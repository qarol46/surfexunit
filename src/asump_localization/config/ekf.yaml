ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true
    
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    
    odom0: /lidar_odometry
    odom0_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10
    
    # === IMU ===
    imu0: /imu/data
    # Используем только угловую скорость по Z (vyaw). Это самое стабильное при поворотах.
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true # <-- ИЗМЕНЕНИЕ: true часто работает стабильнее для IMU, так как абсолютный yaw может дрейфовать
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true
    
    sensor_timeout: 0.2
    transform_timeout: 0.5