amcl:
  ros__parameters:
    use_sim_time: true
    
    # === 1. Модель движения (Шум одометрии) ===
    # Увеличиваем эти значения, чтобы при повороте частицы "разлетались" шире, 
    # давая AMCL шанс найти правильное совпадение по лидару, даже если одометрия врёт.
    alpha1: 0.3   # Шум вращения при вращении (было 0.2)
    alpha2: 0.2   # Шум вращения при движении вперед
    alpha3: 0.2   # Шум движения вперед при движении вперед
    alpha4: 0.3   # Шум движения вперед при вращении (было 0.2)
    alpha5: 0.2

    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    
    # === 2. Частота обновлений (КРИТИЧЕСКИ ВАЖНО для поворотов) ===
    # По умолчанию update_min_a = 0.2 (около 11 градусов). 
    # Робот поворачивает, но AMCL ждет 11 градусов, чтобы обработать скан. 
    # За это время одометрия уже уехала! Уменьшаем до 3-5 градусов.
    update_min_a: 0.05  # Минимальный угол поворота для обновления (радианы)
    update_min_d: 0.15  # Минимальное расстояние для обновления (метры)
    
    # === 3. Лазерная модель (Likelihood Field) ===
    # Делаем модель более устойчивой к временным несовпадениям на поворотах
    laser_model_type: "likelihood_field"
    laser_max_range: 12.0       # Ограничьте макс. дальность, если в симуляции есть шумные дальние лучи
    laser_min_range: 0.1
    max_beams: 60               # Количество лучей для оценки (60-80 оптимально для производительности)
    
    z_hit: 0.75     # Вес "правильных" попаданий в карту (немного увеличили)
    z_rand: 0.20    # Вес случайного шума (увеличили, чтобы фильтр не "схлопывался" при несовпадении)
    z_short: 0.05   # Вес неожиданных близких препятствий (динамические объекты)
    z_max: 0.00     # Обычно 0 для likelihood_field
    
    sigma_hit: 0.2  # Стандартное отклонение для z_hit
    lambda_short: 0.1

    # === 4. Частицы и восстановление ===
    min_particles: 500
    max_particles: 3000  # Увеличили с 2000. Больше частиц = выше шанс не потеряться в коридоре/при повороте
    
    # Разрешаем фильтру медленно "расширяться", если он начинает терять уверенность
    recovery_alpha_slow: 0.001  
    recovery_alpha_fast: 0.1    
    resample_interval: 1
    
    # === 5. TF и прочее ===
    tf_broadcast: true
    transform_tolerance: 1.0    # Увеличили с 0.5/1.0. Если на повороте есть лаг, TF не будет устаревать
    save_pose_rate: 0.5
    
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    scan_topic: /scan
    map_topic: /map_base
    
    set_initial_pose: false
    initial_pose:
      x: 0.0
      y: 0.0
      yaw: 0.0