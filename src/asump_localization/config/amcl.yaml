amcl:
  ros__parameters:
    use_sim_time: true
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    
    # === 1. Модель движения (Шум одометрии) ===
    # Чуть расширяем облако при поворотах, чтобы не терять сходимость
    alpha1: 0.3   # Шум вращения при вращении
    alpha2: 0.2   # Шум вращения при движении вперед
    alpha3: 0.2   # Шум движения вперед при движении вперед
    alpha4: 0.3   # Шум движения вперед при вращении
    alpha5: 0.2
    
    # === 2. Частота обновлений (КРИТИЧНО ДЛЯ ПОВОРОТОВ) ===
    update_min_d: 0.15  # Мин. расстояние (метры)
    update_min_a: 0.05  # Мин. угол поворота (~3 градуса). Фильтр будет "углевать" каждый микро-поворот!
    
    # === 3. Лазерная модель (Жесткая привязка к карте) ===
    laser_model_type: "likelihood_field"
    scan_topic: /scan
    laser_min_range: 0.1
    laser_max_range: 12.0       # Отсекаем шумные дальние лучи
    max_beams: 80               # Чуть больше лучей для надежности на поворотах
    z_hit: 0.85                 # Жестко верим попаданиям (вместо 0.5 или 0.75)
    z_rand: 0.15                # Минимум случайного шума
    z_short: 0.00
    z_max: 0.00
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    
    # === 4. Частицы и ВОССТАНОВЛЕНИЕ (УБИРАЕМ ПАНИКУ) ===
    min_particles: 500
    max_particles: 3000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    kld_err: 0.05
    kld_z: 0.99
    
    # ⚠️ САМОЕ ВАЖНОЕ ИСПРАВЛЕНИЕ:
    # Мы запрещаем фильтру паниковать и разбрасывать случайные частицы на поворотах
    recovery_alpha_slow: 0.0005  
    recovery_alpha_fast: 0.001   # Было 0.1! Именно это вызывало телепорты
    
    # === 5. TF и прочее ===
    odom_frame_id: odom
    base_frame_id: base_footprint
    global_frame_id: map
    tf_broadcast: true
    transform_tolerance: 0.2     # Было 1.0. Для симуляции 1.0 это слишком много, вызывает рывки
    save_pose_rate: 0.5
    
    # === 6. Начальная поза ===
    set_initial_pose: true
    initial_pose:
      x: 1.0
      y: 1.0
      z: 0.0
      yaw: 0.0
      
    # Beam skip отключаем, он может вызывать резкие скачки весов
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3