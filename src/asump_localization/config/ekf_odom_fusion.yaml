# EKF (robot_localization) для фьюза одометрии в режиме навигации:
#   odom0 = icp_odometry (2D-лидар, rtabmap_odom)
#   odom1 = rgbd_odometry (depth-камера, rtabmap_odom)
#   imu0  = IMU (только угловая скорость yaw)
# Выход: /odometry/filtered + TF odom -> base_footprint.
# TF map -> odom публикует rtabmap в режиме локализации (не EKF!),
# поэтому world_frame = odom, а map_frame здесь не используется.
# use_sim_time переопределяется из launch-файла.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Одометрия ICP по лидару: позиция x,y,yaw + скорости vx,vyaw
    odom0: /odom_icp
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # Визуальная одометрия по RGB-D: то же множество величин,
    # EKF взвесит обе по их ковариациям
    odom1: /odom_rgbd
    odom1_config: [true,  true,  false,
                   false, false, true,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom1_differential: false
    odom1_relative: false
    odom1_queue_size: 10

    # IMU: только угловая скорость по Z (самый стабильный канал).
    # relative=true — абсолютный yaw IMU может дрейфовать.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    sensor_timeout: 0.2
    transform_timeout: 0.5
