# Параметры RTAB-Map SLAM - вариант "одна камера + лидар"
# Отличия от двухкамерного варианта:
#   - rgbd_cameras: 1
#   - убраны Vis/EstimationType и Vis/CorGuessWinSize (нужны только при
#     нескольких камерах без пересечения FOV; для одной камеры лучше
#     оставить значения по умолчанию)
# Формат: wildcard /** применяется ко всем нодам, которым передан этот файл
# (rtabmap, rgbd_sync и т.д.). use_sim_time задаётся в launch-файле.
/**:
  ros__parameters:
    # --- Frames ---
    frame_id: base_footprint
    odom_frame_id: odom
    publish_tf: true

    # --- Подписки ---
    subscribe_rgbd: true
    subscribe_scan: true
    rgbd_cameras: 1              # только передняя камера
    approx_sync: true
    sync_queue_size: 10

    # --- Одометрия (TF от lidar_odometry_node) ---
    odom_tf_linear_variance: 0.001
    odom_tf_angular_variance: 0.001

    # --- RTAB-Map core ---
    RGBD/NeighborLinkRefining: "true"
    RGBD/ProximityBySpace: "true"
    RGBD/ProximityByTime: "false"
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/OptimizeFromGraphEnd: "false"
    RGBD/OptimizeMaxError: "2.5"
    RGBD/LocalRadius: "2"
    Vis/MinInliers: "20"

    # --- Регистрация ---
    Reg/Strategy: "2"
    Reg/Force3DoF: "true"
    Icp/CorrespondenceRatio: "0.3"
    Icp/Strategy: "0"
    Icp/PointToPlane: "false"
    Icp/MaxCorrespondenceDistance: "0.15"
    Icp/VoxelSize: "0.05"

    # --- Occupancy grid ---
    # 2 = карта из лидарного скана И облака камеры: лидар рейтрейсит
    # свободное пространство и контур, камера добавляет препятствия
    # вне плоскости сканирования.
    Grid/Sensor: "2"
    # RangeMax ограничивает ray tracing ОБОИХ сенсоров. Лучи лидара дальше
    # этой дистанции НЕ помечают клетки свободными -> пустые (серые)
    # области на карте. Ставьте под реальную дальность лидара.
    Grid/RangeMax: "8.0"
    # Мелкие кластеры точек (ножки стульев, провода, шум depth-камеры)
    # отбрасываются. Если камера теряет мелкие препятствия - уменьшайте.
    Grid/MinClusterSize: "10"
    Grid/RayTracing: "true"
    Grid/MinGroundHeight: "0.05"
    Grid/MaxObstacleHeight: "1.2"
    Grid/CellSize: "0.05"

    # --- Память / облако ---
    Mem/STMSize: "30"
    cloud_voxel_size: "0.2"
