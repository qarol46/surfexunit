# ROS-Gazebo topic bridge configuration
# Загружается через ros_gz_bridge в launch_sim.launch.py
#
# ВАЖНО: gz_topic_name должны совпадать с <topic> сенсоров в
# src/asump_description2/urdf/robot.xacro (Gazebo сам добавляет
# ведущий слэш). ROS-имена выбраны стабильными — их используют ноды.
#
# override_frame_id: Gazebo публикует данные сенсоров в scoped-фреймах
# вида "asump0/base_footprint/lidar_sensor", которых нет в TF-дереве
# от robot_state_publisher. Подменяем frame_id на имена линков из URDF,
# чтобы RViz/Foxglove могли разрешить трансформы.

# Часы симуляции (обязательно)
- ros_topic_name: "/clock"
  gz_topic_name: "/clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: "GZ_TO_ROS"

# Состояния суставов
- ros_topic_name: "/joint_states"
  gz_topic_name: "/joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: "GZ_TO_ROS"

# Одометрия и TF
- ros_topic_name: "/odom"
  gz_topic_name: "/odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: "GZ_TO_ROS"

- ros_topic_name: "/tf"
  gz_topic_name: "/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: "GZ_TO_ROS"

# Команды скорости (ROS -> Gazebo)
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: "ROS_TO_GZ"

# LiDAR (Gazebo -> ROS 2)
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: "GZ_TO_ROS"
  override_frame_id: "laser"

# IMU (Gazebo -> ROS 2)
- ros_topic_name: "/imu/data"
  gz_topic_name: "/imu/data"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: "GZ_TO_ROS"

# ==========================================
# Передняя камера RealSense D435 (color + depth)
# gz-топики из robot.xacro: face_camera/color/image_raw,
# face_camera/depth/image_rect_raw (+ .../camera_info автоматически)
# ==========================================
- ros_topic_name: "/face_camera/image"
  gz_topic_name: "/face_camera/color/image_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"
  override_frame_id: "face_camera_color_frame"

- ros_topic_name: "/face_camera/camera_info"
  gz_topic_name: "/face_camera/color/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"
  override_frame_id: "face_camera_color_frame"

- ros_topic_name: "/face_camera/depth_image"
  gz_topic_name: "/face_camera/depth/image_rect_raw"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: "GZ_TO_ROS"
  override_frame_id: "face_camera_depth_frame"

- ros_topic_name: "/face_camera/depth_camera_info"
  gz_topic_name: "/face_camera/depth/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: "GZ_TO_ROS"
  override_frame_id: "face_camera_depth_frame"

# ==========================================
# Задняя камера RealSense D435 (color + depth)
