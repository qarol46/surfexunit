path_follower:
  ros__parameters:
    max_linear_vel: 0.5
    max_angular_vel: 1.0
    min_approach_linear_vel: 0.05
    approach_velocity_scaling_dist: 1.0
    base_lookahead_dist: 0.6
    min_lookahead_dist: 0.3
    max_lookahead_dist: 1.2
    lookahead_time: 1.5
    goal_reached_tolerance: 0.1
    goal_yaw_tolerance: 0.15
    curvature_velocity_scaling: 0.5
    control_frequency: 20.0
    use_velocity_scaled_lookahead: true
    use_regulated_linear_velocity_scaling: true
    robot_base_frame: "base_footprint"
    global_frame: "map"
    planner_service_name: "get_path_to_point"

    # Закон управления (плавность)
    rotate_in_place_threshold: 0.3   # угол ошибки, выше которого разворот на месте
    full_speed_angle: 0.1            # до этого угла — полная скорость (далее smoothstep)
    rotation_kp: 2.0                 # P-коэффициент разворота на месте
    steering_kp: 0.5                 # добавка к pure pursuit по ошибке курса (малый!)
    max_linear_accel: 0.4            # м/с^2, slew rate линейной скорости
    max_angular_accel: 1.5           # рад/с^2, slew rate угловой скорости
    # min_angular_vel = 0: без релейного управления (min>0 вместе с dead zone
    # давал предельный цикл — коррекция курса скачком на полную скорость)
    min_linear_vel: 0.1
    min_angular_vel: 0.0
    angle_dead_zone: 0.03            # рад (~2 градуса)
    invert_angular: false
    cmd_vel_topic: "/cmd_vel"
