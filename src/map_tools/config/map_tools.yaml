map_publisher:
  ros__parameters:
    # Укажи здесь абсолютный путь к твоему map.yaml
    # Например: /home/user/maps/my_map.yaml
    map_yaml: "/home/kirill/ros2_ws/src/surfexunit/src/asump_localization/maps/test_rtabmap.yaml"
    map_topic: /map_base
    frame_id: map

    # 0.0 - опубликовать один раз и держать как latched
    # >0.0 - периодически переопубликовать, удобно для отладки
    publish_rate: 5.0

inflation_publisher:
  ros__parameters:
    input_map_topic: /map_base
    output_map_topic: /map_inflated

    # Радиус inflation в метрах
    inflation_radius: 0.55

    # Раздувать ли unknown-зоны
    inflate_unknown: true

zones_publisher:
  ros__parameters:
    frame_id: map
    publish_rate: 1.0

    charging_station:
      enabled: true
      name: "charging_station_1"

      # Центр зарядной станции в системе координат map.
      # В мире Gazebo станция стоит в (0.0, -2.5), пандусом на +x;
      # ноль карты смещён относительно нуля мира: map_x = world_x - 2.51, map_y = world_y
      # (определено по положению стен в new_warehouse_map.pgm).
      x: -2.51
      y: -2.5
      yaw: 0.0

      # Радиус зоны зарядки, метры
      radius: 2.5

    # Номер этажа: от него зависят координаты лестницы
    # (1 = first_floor, 2 = second_floor)
    floor: 1

    stairs:
      enabled: true
      name: "stairs"
      # TODO: подставить реальные координаты лестницы каждого этажа
      # в системе координат map
      floor1:
        x: 0.0
        y: 0.0
        yaw: 0.0
      floor2:
        x: 0.0
        y: 0.0
        yaw: 0.0

    # Запретные зоны (куда роботу ехать нельзя), публикуются полигонами
    # в /zones/no_go/<имя> + красный контур в /zones/markers
    no_go_zones:
      names: ["stairs_keepout"]
      stairs_keepout:
        enabled: true
        # Плоский список вершин полигона: [x1, y1, x2, y2, ...]
        # TODO: подставить реальные вершины (например, вокруг лестницы)
        points: [0.0, 0.0, 1.0, 0.0, 1.0, 1.0, 0.0, 1.0]